
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sallee Shop Board</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop Board">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --card: #1c2430;
    --line: #2a3441;
    --text: #e8edf3;
    --muted: #8b98a8;
    --accent: #f2b233;
    --blue: #3b8eea;
    --green: #2fb86b;
    --amber: #f2a33a;
    --red: #e5484d;
    --gray: #6b7785;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; overflow: hidden; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2vh 2vw; border-bottom: 3px solid var(--accent); height: 10vh;
  }
  .brand { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 4.6vh; letter-spacing: .06em; }
  .brand span { color: var(--accent); }
  .clock { text-align: right; font-family: 'Barlow Condensed', sans-serif; }
  .clock .time { font-size: 4.4vh; font-weight: 600; line-height: 1; }
  .clock .date { font-size: 2.1vh; color: var(--muted); letter-spacing: .05em; }

  main { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 1.2vw; padding: 1.5vh 1.5vw; height: 84vh; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  .col h2 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 3.2vh; letter-spacing: .08em;
    padding: 1.2vh 1vw; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
  }
  .col h2 .count { background: var(--card); color: var(--muted); border-radius: 999px; padding: .2vh .9vw; font-size: 2.2vh; }
  .col.safety h2 { color: var(--green); }
  .col.ongoing h2 { color: var(--blue); }
  .col.upcoming h2 { color: var(--accent); }
  .list { flex: 1; overflow: hidden; padding: 1vh .8vw 0; min-height: 0; }
  .reel { will-change: transform; }
  .track { display: flex; flex-direction: column; gap: 1vh; padding-bottom: 1vh; }
  .track.loop { padding-bottom: 4vh; }  /* breathing room between the end of the list and its repeat */

  .card { background: var(--card); border-radius: 8px; padding: 1.2vh 1vw; border-left: 6px solid var(--gray); }
  .card.s-blue { border-left-color: var(--blue); }
  .card.s-green { border-left-color: var(--green); }
  .card.s-amber { border-left-color: var(--amber); }
  .card.s-red { border-left-color: var(--red); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: .8vw; }
  .unit { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 3.1vh; letter-spacing: .03em; }
  .job { font-size: 2.3vh; font-weight: 500; margin-top: .3vh; }
  .meta { display: flex; flex-wrap: wrap; gap: .4vh 1.2vw; margin-top: .7vh; font-size: 1.85vh; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .notes { margin-top: .6vh; font-size: 1.8vh; color: var(--muted); font-style: italic; }
  .chip {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 1.9vh; letter-spacing: .05em;
    padding: .25vh .7vw; border-radius: 5px; white-space: nowrap; background: var(--gray); color: #fff;
  }
  .chip.blue { background: var(--blue); } .chip.green { background: var(--green); }
  .chip.amber { background: var(--amber); color: #1a1a1a; } .chip.red { background: var(--red); }
  .card.done { opacity: .55; }
  .meta .out { color: #c9a6ff; font-weight: 600; letter-spacing: .03em; }
  .empty { color: var(--muted); font-size: 2.2vh; text-align: center; margin-top: 4vh; }

  .daygroup { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 2.1vh; color: var(--accent); letter-spacing: .08em; margin-top: .6vh; }
  .daygroup:first-child { margin-top: 0; }

  footer {
    height: 6vh; display: flex; align-items: center; justify-content: space-between;
    padding: 0 2vw; font-size: 1.8vh; color: var(--muted); border-top: 1px solid var(--line);
  }
  footer .stale { color: var(--red); font-weight: 600; }
  footer .who { display: flex; gap: 1.2vw; align-items: center; }
  footer a { color: var(--muted); text-decoration: underline; cursor: pointer; }
  footer a:hover { color: var(--text); }

  /* ---------- intro (wrench) ---------- */
  .screen { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 45%, #1b2430 0%, var(--bg) 65%); transition: opacity .5s ease; }
  .screen.hide { opacity: 0; pointer-events: none; }
  .screen[hidden] { display: none; }
  #splash { cursor: pointer; }
  .sp-stage { position: relative; width: 30vh; height: 30vh; }
  .sp-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sp-wrench { position: absolute; inset: 0; animation: sp-in .7s cubic-bezier(.2,.9,.25,1) both, sp-turn 1.2s .7s ease-in-out both; transform-origin: 50% 50%; }
  .sp-ring { position: absolute; inset: 22%; border-radius: 50%; border: .5vh solid var(--accent); opacity: 0;
             animation: sp-ring .7s 1.85s ease-out forwards; }
  .sp-title { margin-top: 4vh; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9vh; letter-spacing: .08em;
              animation: sp-up .6s 1.7s ease-out both; }
  .sp-title span { color: var(--accent); }
  .sp-bar { height: .6vh; width: 0; background: var(--accent); border-radius: 1vh; margin-top: 1.2vh; animation: sp-bar .6s 2.1s ease-out forwards; }
  .sp-tag { margin-top: 1.8vh; font-family: 'Barlow Condensed', sans-serif; font-size: 2.6vh; letter-spacing: .3em; color: var(--muted);
            animation: sp-up .6s 2.35s ease-out both; }
  @keyframes sp-in   { from { transform: translateY(-8vh) rotate(-200deg) scale(.5); opacity: 0; } to { transform: rotate(-40deg); opacity: 1; } }
  @keyframes sp-turn { 0% { transform: rotate(-40deg); } 35% { transform: rotate(12deg); } 50% { transform: rotate(-14deg); }
                       85% { transform: rotate(8deg); } 100% { transform: rotate(0deg); } }
  @keyframes sp-ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes sp-up   { from { transform: translateY(2vh); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sp-bar  { to { width: 52vh; } }

  /* ---------- sign-in ---------- */
  .si-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6vh 6vh 5vh; max-width: 92vw;
             background: rgba(21,27,35,.85); border: 1px solid var(--line); border-radius: 16px; }
  .si-card svg { width: 14vh; height: 14vh; }
  .si-title { margin-top: 2vh; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 6vh; letter-spacing: .08em; }
  .si-title span { color: var(--accent); }
  .si-text { margin-top: 1.5vh; color: var(--muted); font-size: 2.3vh; max-width: 60vh; line-height: 1.4; }
  .si-btn { margin-top: 4vh; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 2.6vh; color: #14181f; background: var(--accent);
            border: 0; border-radius: 10px; padding: 1.8vh 4vh; cursor: pointer; min-height: 48px; }
  .si-btn:hover { filter: brightness(1.08); }
  .si-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .si-err { margin-top: 2.4vh; color: var(--red); font-size: 2vh; max-width: 60vh; min-height: 2.4vh; }
  .notice { position: fixed; inset: auto 0 8vh 0; margin: 0 auto; width: max-content; max-width: 90vw; z-index: 40; background: #3a1a1c;
            border: 1px solid var(--red); color: #ffd7d8; padding: 1.4vh 2.4vh; border-radius: 10px; font-size: 2.1vh; }
  .notice[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .sp-wrench, .sp-ring, .sp-title, .sp-bar, .sp-tag { animation-duration: .01s !important; animation-delay: 0s !important; }
    .sp-bar { width: 52vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">SALLEE <span>SHOP</span> BOARD</div>
  <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
</header>

<main>
  <section class="col safety"><h2>SAFETY INSPECTIONS <span class="count" id="c-safety">0</span></h2><div class="list" id="l-safety"></div></section>
  <section class="col ongoing"><h2>IN THE SHOP <span class="count" id="c-ongoing">0</span></h2><div class="list" id="l-ongoing"></div></section>
  <section class="col upcoming"><h2>SCHEDULED <span class="count" id="c-upcoming">0</span></h2><div class="list" id="l-upcoming"></div></section>
</main>

<footer>
  <div id="updated">Loading…</div>
  <div class="who" id="who">Refreshes every minute</div>
</footer>

<div class="notice" id="notice" hidden></div>

<!-- Intro: shown each time the board opens (tap to skip) -->
<div class="screen" id="splash" title="Tap to skip">
  <div class="sp-stage"><div class="sp-ring"></div><div class="sp-wrench" id="sp-wrench"></div></div>
  <div class="sp-title">SALLEE <span>SHOP</span> BOARD</div>
  <div class="sp-bar"></div>
  <div class="sp-tag">INSPECTIONS · IN THE SHOP · SCHEDULED</div>
</div>

<!-- Sign-in: shown when nobody is signed in (or the sign-in has expired) -->
<div class="screen" id="signin" hidden>
  <div class="si-card">
    <div id="si-wrench"></div>
    <div class="si-title">SALLEE <span>SHOP</span> BOARD</div>
    <div class="si-text">Sign in with your Sallee Microsoft 365 account to view the shop board.</div>
    <button class="si-btn" id="si-btn" type="button">Sign in with Microsoft 365</button>
    <div class="si-err" id="si-err" role="alert"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="msal-browser.min.js"></script>
<script>
const DATA_URL = 'data/shop.json';
const REFRESH_MS = 60 * 1000;
const STALE_MIN = 45;            // flag if the flow hasn't written in this many minutes
const UPCOMING_DAYS = 30;        // how far ahead the Scheduled column looks

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up = s => String(s ?? '').trim().toUpperCase();

// Parse "yyyy-MM-dd" as a LOCAL date (date-only, no time-of-day/timezone drift)
function parseDay(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayDiff(a, b) { return Math.round((a - b) / 86400000); }
function fmtDay(d) { return d ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : ''; }

function kind(job) {
  const t = up(job.type);
  if (t.startsWith('SAFE') || t.startsWith('INSP') || t.startsWith('ROUT')) return 'safety';  // ROUTINE counts as a safety inspection
  if (t.startsWith('ONG') || t.includes('PROGRESS') || t === 'ACTIVE') return 'ongoing';
  return 'upcoming';
}

// status → color
function statusColor(status) {
  const s = up(status);
  if (!s) return 'gray';
  if (/DONE|COMPLETE|CLOSED/.test(s)) return 'green';
  if (/PART|WAIT|HOLD|VENDOR/.test(s)) return 'amber';
  if (/PROGRESS|WORKING|STARTED|ACTIVE/.test(s)) return 'blue';
  return 'gray';
}
const isDone = j => statusColor(j.status) === 'green';

// ---------- card builders ----------
function card({ unit, job, chip, chipColor, stripe, meta = [], notes, done }) {
  return `<div class="card s-${stripe}${done ? ' done' : ''}">
    <div class="top"><div class="unit">${esc(unit || '—')}</div>${chip ? `<span class="chip ${chipColor}">${esc(chip)}</span>` : ''}</div>
    <div class="job">${esc(job)}</div>
    ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
    ${notes ? `<div class="notes">${esc(notes)}</div>` : ''}
  </div>`;
}
const m = (label, val) => val ? `<span>${label} <b>${esc(val)}</b></span>` : '';
// Location: only shown when the job is NOT in house (e.g. "Cummins", "Outside - dealer")
const loc = j => { const l = String(j.location ?? '').trim(); return l && !/^(IN ?HOUSE|SHOP)$/i.test(l) ? `<span class="out">OUT @ ${esc(l)}</span>` : ''; };

function dueChip(due, t) {
  if (!due) return null;
  const d = dayDiff(due, t);
  if (d < 0) return { text: `OVERDUE ${-d}D`, color: 'red' };
  if (d === 0) return { text: 'DUE TODAY', color: 'amber' };
  if (d === 1) return { text: 'DUE TOMORROW', color: 'amber' };
  return null;
}

function renderSafety(jobs, t) {
  return jobs
    .sort((a, b) => (parseDay(a.due) || 8.64e15) - (parseDay(b.due) || 8.64e15))
    .map(j => {
      const due = parseDay(j.due);
      const dc = !isDone(j) && dueChip(due, t);
      const color = dc ? dc.color : statusColor(j.status);
      return card({
        unit: j.unit, job: j.job, done: isDone(j),
        chip: dc ? dc.text : (j.status ? up(j.status) : up(j.frequency)),
        chipColor: color, stripe: color === 'gray' ? 'green' : color,
        meta: [m('Every', j.frequency && j.frequency.toLowerCase()), m('Next', due && fmtDay(due)), m('Tech', j.mechanic), loc(j)],
        notes: j.notes
      });
    }).join('');
}

function renderOngoing(jobs, t) {
  const rank = j => ({ red: 0, amber: 1, blue: 2, gray: 3, green: 4 }[j._color]);
  return jobs
    .filter(j => !isDone(j) || (parseDay(j.completed) && dayDiff(parseDay(j.completed), t) === 0))
    .map(j => {
      const due = parseDay(j.due), start = parseDay(j.start);
      const dc = !isDone(j) && dueChip(due, t);
      j._color = dc && dc.color === 'red' ? 'red' : statusColor(j.status);
      j._dc = dc;
      j._days = start ? dayDiff(t, start) : null;
      return j;
    })
    .sort((a, b) => rank(a) - rank(b) || (b._days ?? 0) - (a._days ?? 0))
    .map(j => card({
      unit: j.unit, job: j.job, done: isDone(j),
      chip: j._dc && !isDone(j) ? j._dc.text : up(j.status || 'IN SHOP'),
      chipColor: j._dc && !isDone(j) ? j._dc.color : j._color,
      stripe: j._color,
      meta: [
        m('Tech', j.mechanic),
        j._days != null ? `<span>In shop <b>${j._days === 0 ? 'today' : j._days + (j._days === 1 ? ' day' : ' days')}</b></span>` : '',
        m('Due', parseDay(j.due) && fmtDay(parseDay(j.due))),
        loc(j)
      ],
      notes: j.notes
    })).join('');
}

function renderUpcoming(jobs, t) {
  const horizon = new Date(t); horizon.setDate(horizon.getDate() + UPCOMING_DAYS);
  const list = jobs
    .filter(j => !isDone(j))
    .map(j => ({ ...j, _d: parseDay(j.start) || parseDay(j.due) }))
    .filter(j => !j._d || j._d <= horizon)
    .sort((a, b) => (a._d || 8.64e15) - (b._d || 8.64e15));

  let html = '', lastKey = null;
  for (const j of list) {
    let key;
    if (!j._d) key = 'UNSCHEDULED';
    else {
      const d = dayDiff(j._d, t);
      key = d < 0 ? 'PAST DUE' : d === 0 ? 'TODAY' : d === 1 ? 'TOMORROW' : fmtDay(j._d).toUpperCase();
    }
    if (key !== lastKey) { html += `<div class="daygroup">${key}</div>`; lastKey = key; }
    const late = j._d && dayDiff(j._d, t) < 0;
    const color = late ? 'red' : (j._d && dayDiff(j._d, t) <= 1 ? 'amber' : 'gray');
    html += card({
      unit: j.unit, job: j.job,
      chip: j.priority ? up(j.priority) : null,
      chipColor: /HIGH|URGENT/.test(up(j.priority)) ? 'red' : 'gray',
      stripe: color,
      meta: [m('Tech', j.mechanic), loc(j)],
      notes: j.notes
    });
  }
  return html;
}

// ---------- load + render ----------
function fill(id, html, count) {
  document.getElementById('c-' + id).textContent = count;
  const st = reels[id];
  if (st && st.html === html) return;          // nothing changed: keep scrolling where we are
  const list = document.getElementById('l-' + id);
  list.innerHTML = `<div class="reel"><div class="track">${html || '<div class="empty">Nothing here</div>'}</div></div>`;
  reels[id] = { html, list, reel: list.firstChild, offset: 0, loopH: 0, pause: START_PAUSE };
  measure(id);
}

function render(jobs) {
  const t = today();
  const groups = { safety: [], ongoing: [], upcoming: [] };
  jobs.forEach(j => groups[kind(j)].push(j));
  fill('safety', renderSafety(groups.safety, t), groups.safety.filter(j => !isDone(j)).length);
  const ongoingHtml = renderOngoing(groups.ongoing, t);
  fill('ongoing', ongoingHtml, groups.ongoing.filter(j => !isDone(j)).length);
  const upHtml = renderUpcoming(groups.upcoming, t);
  fill('upcoming', upHtml, (upHtml.match(/class="card/g) || []).length);
}

// Lowercase column names so UNIT / Unit / unit all work; drop blank rows
const normalize = rows => rows
  .map(r => Object.fromEntries(Object.entries(r || {}).map(([k, v]) => [String(k).trim().toLowerCase(), v ?? ''])))
  .filter(j => String(j.unit).trim() || String(j.job).trim());

// ---------- settings + sign-in (Microsoft 365) ----------
const C = window.SHOP_CONFIG || {};
const LIVE = !!(C.clientId && C.tenantId && C.fileUrl && window.msal);
const SCOPES = ['User.Read', 'Files.Read.All'];
const GRAPH = 'https://graph.microsoft.com/v1.0';
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
let pca = null, account = null, fileRef = null, lastGood = null, polling = null;

class NeedsSignIn extends Error {}

async function initAuth() {
  pca = new msal.PublicClientApplication({
    auth: { clientId: C.clientId, authority: `https://login.microsoftonline.com/${C.tenantId}`, redirectUri: REDIRECT, postLogoutRedirectUri: REDIRECT },
    cache: { cacheLocation: 'localStorage' }
  });
  await pca.initialize();
  const res = await pca.handleRedirectPromise();
  account = (res && res.account) || pca.getActiveAccount() || pca.getAllAccounts()[0] || null;
  if (account) pca.setActiveAccount(account);
  return !!res;                                   // true = just came back from the Microsoft sign-in page
}

async function token() {
  try { return (await pca.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) { throw new NeedsSignIn(e.message); }
}

async function graph(path) {
  const res = await fetch(GRAPH + path, { headers: { Authorization: 'Bearer ' + await token() } });
  if (res.status === 401) throw new NeedsSignIn('Session expired');
  if (res.status === 403) throw new Error("this account doesn't have access to the shop file");
  if (res.status === 404) throw new Error('shop file or table not found — check fileUrl and table in config.js');
  if (!res.ok) throw new Error('SharePoint error ' + res.status);
  return res.json();
}

// SharePoint/OneDrive link → Graph "share id"
const shareId = url => 'u!' + btoa(unescape(encodeURIComponent(url.trim()))).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');

const DATE_COLS = ['start', 'due', 'completed'];
const pad = n => String(n).padStart(2, '0');
function toISODay(value, text) {
  if (typeof value === 'number' && value > 20000) {            // Excel date serial
    const d = new Date(Math.round((value - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  }
  const t = String(text ?? value ?? '').trim();
  if (!t || /^\d{4}-\d{2}-\d{2}/.test(t)) return t;
  const d = new Date(t);                                        // e.g. 9/26/2026
  return isNaN(d) ? t : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

async function loadLive() {
  if (!fileRef) {
    const item = await graph(`/shares/${shareId(C.fileUrl)}/driveItem?$select=id,name,parentReference`);
    fileRef = { drive: item.parentReference.driveId, id: item.id };
  }
  const r = await graph(`/drives/${fileRef.drive}/items/${fileRef.id}/workbook/tables/${encodeURIComponent(C.table || 'Table1')}/range?$select=values,text`);
  const [head = [], ...rows] = r.values || [];
  const text = r.text || [];
  const cols = head.map(h => String(h).trim().toLowerCase());
  return normalize(rows.map((row, i) => Object.fromEntries(cols.map((c, j) => {
    const v = row[j], tx = (text[i + 1] || [])[j];
    return [c, DATE_COLS.includes(c) ? toISODay(v, tx) : String(tx ?? v ?? '').trim()];
  }))));
}

async function loadDemo() {
  const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return { jobs: normalize(Array.isArray(data) ? data : (data.jobs || data.value || [])), updated: data.updated ? new Date(data.updated) : null };
}

const fmtTime = d => d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

async function load() {
  const el = document.getElementById('updated');
  try {
    if (LIVE) {
      render(await loadLive());
      lastGood = new Date();
      el.textContent = `Live from SharePoint · updated ${fmtTime(lastGood)}`;
    } else {
      const { jobs, updated } = await loadDemo();
      render(jobs);
      if (updated && !isNaN(updated)) {
        const txt = `Last updated ${fmtTime(updated)}`;
        el.innerHTML = (Date.now() - updated) / 60000 > STALE_MIN ? `<span class="stale">⚠ ${txt} — data may be out of date</span>` : txt;
      } else el.textContent = 'Loaded';
    }
    hideNotice();
  } catch (e) {
    if (e instanceof NeedsSignIn) { stopPolling(); return showSignIn('Your sign-in has expired. Please sign in again.'); }
    const since = lastGood ? ` · last good update ${fmtTime(lastGood)}` : '';
    el.innerHTML = `<span class="stale">⚠ Can't load shop data${since}</span>`;
    showNotice(`Can't load shop data: ${e.message}`);
  }
}

function startPolling() { stopPolling(); load(); polling = setInterval(load, (C.refreshSeconds || 60) * 1000); }
function stopPolling() { if (polling) clearInterval(polling); polling = null; }
function showNotice(msg) { const n = document.getElementById('notice'); n.textContent = msg; n.hidden = false; }
function hideNotice() { document.getElementById('notice').hidden = true; }

function showSignIn(err) {
  const s = document.getElementById('signin');
  document.getElementById('si-err').textContent = err || '';
  s.hidden = false; requestAnimationFrame(() => s.classList.remove('hide'));
  document.getElementById('si-btn').focus();
}
document.getElementById('si-btn').addEventListener('click', async () => {
  document.getElementById('si-err').textContent = '';
  try { await pca.loginRedirect({ scopes: SCOPES, prompt: 'select_account' }); }
  catch (e) { document.getElementById('si-err').textContent = 'Sign-in failed: ' + e.message; }
});

function setWho() {
  const who = document.getElementById('who');
  if (!LIVE) { who.textContent = 'Demo mode · refreshes every minute'; return; }
  who.innerHTML = `<span>${esc(account.name || account.username)}</span><a id="signout">Sign out</a>`;
  document.getElementById('signout').onclick = () => pca.logoutRedirect({ account });
}

// ---------- wrench artwork (used by intro, sign-in and app icons) ----------
let wid = 0;
function wrenchSVG(color = '#f2b233') {
  const id = 'wm' + (++wid);
  return `<svg viewBox="-60 -60 120 120" role="img" aria-label="Wrench"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120">
    <rect x="-60" y="-60" width="120" height="120" fill="#fff"/><rect x="-8.5" y="-62" width="17" height="30" rx="2" fill="#000"/><circle cx="0" cy="40" r="6.5" fill="#000"/></mask></defs>
    <g transform="rotate(45)"><g mask="url(#${id})" fill="${color}">
    <circle cx="0" cy="-36" r="20"/><rect x="-8" y="-36" width="16" height="74" rx="8"/><circle cx="0" cy="40" r="13.5"/></g></g></svg>`;
}
document.getElementById('sp-wrench').innerHTML = wrenchSVG();
document.getElementById('si-wrench').innerHTML = wrenchSVG();

// ---------- start-up: intro → (sign in) → board ----------
const SPLASH_MS = 3300;
function runSplash() {
  const sp = document.getElementById('splash');
  return new Promise(done => {
    const finish = () => { sp.classList.add('hide'); setTimeout(() => sp.hidden = true, 500); done(); };
    const timer = setTimeout(finish, SPLASH_MS);
    sp.addEventListener('click', () => { clearTimeout(timer); finish(); }, { once: true });
  });
}

(async function boot() {
  let cameBack = false, authErr = '';
  const splash = LIVE && location.hash.includes('code=') ? null : runSplash();   // skip intro when returning from Microsoft
  if (LIVE) {
    try { cameBack = await initAuth(); } catch (e) { authErr = 'Sign-in problem: ' + e.message; }
  }
  if (splash) await splash; else { const sp = document.getElementById('splash'); sp.hidden = true; }
  if (LIVE && !account) return showSignIn(authErr);
  setWho();
  startPolling();
})();

// Reload once a night (3 AM) so the shop TV picks up board updates on its own
setInterval(() => { const n = new Date(); if (n.getHours() === 3 && n.getMinutes() === 0) location.reload(); }, 60 * 1000);

// ---------- continuous auto-scroll (ticker loop) for long columns ----------
// If a column's cards don't fit, a second copy is placed under the first and the column
// scrolls up forever; when the copy reaches the top it's swapped back invisibly — no stop, no jump.
const reels = {};
const SPEED_VH_PER_SEC = 2.5;   // scroll speed: % of screen height per second (raise to go faster)
const START_PAUSE = 4;          // seconds to hold at the top after new data arrives

function measure(id) {
  const st = reels[id]; if (!st) return;
  const first = st.reel.firstChild;
  while (st.reel.children.length > 1) st.reel.lastChild.remove();
  first.classList.remove('loop');
  const avail = st.list.clientHeight;
  if (first.offsetHeight > avail + 2) {
    first.classList.add('loop');
    const copy = first.cloneNode(true);
    copy.setAttribute('aria-hidden', 'true');
    st.reel.appendChild(copy);
    st.loopH = first.offsetHeight;
    st.offset %= st.loopH;
  } else {
    st.loopH = 0; st.offset = 0;
  }
  st.reel.style.transform = `translateY(${-st.offset}px)`;
}
window.addEventListener('resize', () => Object.keys(reels).forEach(measure));

let lastT = performance.now();
function animate(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
  const speed = window.innerHeight * SPEED_VH_PER_SEC / 100;
  for (const st of Object.values(reels)) {
    if (!st.loopH) continue;
    if (st.pause > 0) { st.pause -= dt; continue; }
    st.offset = (st.offset + speed * dt) % st.loopH;
    st.reel.style.transform = `translateY(${-st.offset}px)`;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---------- clock ----------
function tick() {
  const n = new Date();
  document.getElementById('time').textContent = n.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  document.getElementById('date').textContent = n.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
}
tick(); setInterval(tick, 1000 * 15);
</script>
